name: Test and sync to GitLab (develop)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      SECRET_KEY: ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements/dev.txt

      - name: Run unit and HTTP tests
        run: python -m pytest -m "unit or http"

  sync-gitlab:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create snapshot without GitHub configuration
        run: |
          mkdir "$RUNNER_TEMP/gitlab-snapshot"
          git archive "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/gitlab-snapshot"
          rm -rf "$RUNNER_TEMP/gitlab-snapshot/.github"
          cd "$RUNNER_TEMP/gitlab-snapshot"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync from GitHub ${GITHUB_SHA}"

      - name: Push snapshot to GitLab
        env:
          GITLAB_REPOSITORY_URL: ${{ secrets.GITLAB_REPOSITORY_URL }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          : "${GITLAB_REPOSITORY_URL:?Missing GITLAB_REPOSITORY_URL secret}"
          : "${GITLAB_TOKEN:?Missing GITLAB_TOKEN secret}"
          cat > "$RUNNER_TEMP/gitlab-askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'oauth2' ;;
            *Password*) printf '%s\n' "$GITLAB_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/gitlab-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/gitlab-askpass"
          export GIT_TERMINAL_PROMPT=0
          cd "$RUNNER_TEMP/gitlab-snapshot"
          git remote add gitlab "$GITLAB_REPOSITORY_URL"
          git push --force gitlab HEAD:develop
